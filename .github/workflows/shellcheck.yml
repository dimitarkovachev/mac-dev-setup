# Runs shellcheck on every shell script in the repository.
# This replaces the old Travis CI build.
name: shellcheck

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check all shell scripts
        run: |
          shopt -s globstar nullglob
          files=(**/*.sh **/*.bash **/*.ksh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"
        shell: bash
